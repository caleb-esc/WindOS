[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windos"
version = "0.2.0"
description = "A Python-based OS emulation with CLI, PySide6 desktop, and localhost gateway"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.6"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
all = ["PySide6>=6.6", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[tool.setuptools.packages.find]
include = ["windos*"]
